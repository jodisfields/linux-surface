name: Build Fedora RPM

# CI pipeline: builds the linux-surface kernel as a Fedora RPM.
#
# On every push/PR:  builds RPM and uploads as a downloadable artifact.
# On tag push:       also publishes the RPM to a GitHub Release.
# Manual dispatch:   build + optional release.

on:
  push:
    branches:
      - develop
      - master
      - 'claude/**'
      - 'copilot/**'
    tags:
      - 'fedora-*'
      - 'release-*'
      - 'kernel-surface-*'

  pull_request:
    branches:
      - develop
      - master

  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish RPMs to a GitHub Release'
        required: false
        default: 'true'
        type: boolean
      fedora_version:
        description: 'Fedora version to build for'
        required: false
        default: '42'
        type: choice
        options:
          - '41'
          - '42'

permissions:
  contents: read

concurrency:
  group: fedora-rpm-${{ github.ref }}
  cancel-in-progress: true

env:
  GPG_KEY_ID: 56C464BAAC421453
  FEDORA: ${{ github.event.inputs.fedora_version || '42' }}

jobs:
  build:
    name: Build RPM (Fedora ${{ github.event.inputs.fedora_version || '42' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize Fedora container
        run: |
          bash ./.github/scripts/container/create.sh \
            registry.fedoraproject.org/fedora:${FEDORA}

      - name: Install build dependencies
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-builddeps

      - name: Setup Secure Boot certificate
        env:
          SB_KEY: ${{ secrets.SURFACE_SB_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SB_KEY \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-secureboot

      - name: Build RPM packages
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh build-packages

      - name: Sign RPM packages
        env:
          GPG_KEY: ${{ secrets.LINUX_SURFACE_GPG_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e GPG_KEY \
            -e GPG_KEY_ID \
            -- \
            bash ./.github/scripts/package/fedora.sh sign-packages

      - name: List built packages
        id: packages
        run: |
          echo "=== Built RPMs ==="
          ls -lh pkg/fedora/kernel-surface/out/x86_64/ 2>/dev/null || echo "No x86_64 RPMs found"
          RPM_COUNT=$(find pkg/fedora/kernel-surface/out -name '*.rpm' -type f 2>/dev/null | wc -l)
          echo "rpm_count=$RPM_COUNT" >> $GITHUB_OUTPUT

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-surface-fedora-${{ env.FEDORA }}-rpms
          path: pkg/fedora/kernel-surface/out/x86_64
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: |
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      )
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            pkg/fedora/kernel-surface/build-linux-surface.py
            contrib

      - name: Download RPM artifacts
        uses: actions/download-artifact@v8
        with:
          name: kernel-surface-fedora-${{ env.FEDORA }}-rpms
          path: release-rpms

      - name: Determine release tag and kernel version
        id: meta
        run: |
          # Extract kernel version from the build script
          KERNEL_VER=$(grep 'PACKAGE_TAG' pkg/fedora/kernel-surface/build-linux-surface.py \
            | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | head -1)

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="kernel-surface-${KERNEL_VER}-$(date +%Y%m%d)"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "kernel_version=$KERNEL_VER" >> $GITHUB_OUTPUT
          echo "Release: $TAG (kernel $KERNEL_VER)"

          # List the RPMs
          echo "=== Release assets ==="
          ls -lh release-rpms/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "kernel-surface ${{ steps.meta.outputs.kernel_version }} (Fedora ${{ env.FEDORA }})"
          body: |
            ## linux-surface kernel ${{ steps.meta.outputs.kernel_version }} — Fedora ${{ env.FEDORA }} RPMs

            Built from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            ### Included patches & features
            - All upstream **linux-surface** hardware patches (Surface SAM, IPTS/ITHC touchscreen, cameras, secureboot, GPE, type-cover, etc.)
            - **BORE** CPU scheduler (Burst-Oriented Response Enhancer) for improved desktop responsiveness
            - **BBR v3** TCP congestion control for better network throughput
            - 1000 Hz timer, full preempt, full tickless, Transparent HugePages (always)
            - MGLRU, ZSWAP with zstd, DAMON reclaim, sched-ext support
            - NTSYNC for Wine/Proton, WireGuard built-in, hardware crypto acceleration
            - Surface Laptop Studio 1 optimizations (dGPU hotplug, Thunderbolt 4, thermal management)

            ### Installation

            ```bash
            # Install the kernel
            sudo dnf install ./kernel-surface-*.rpm

            # (Surface Laptop Studio 1) Apply thermal config
            sudo cp contrib/thermald/surface_laptop_studio_1/thermal-conf.xml /etc/thermald/
            sudo cp contrib/thermald/surface_laptop_studio_1/thermal-cpu-cdev-order.xml /etc/thermald/
            sudo systemctl restart thermald

            # (Optional) Apply runtime performance tuning
            sudo cp contrib/performance-tuning/99-surface-performance.conf /etc/sysctl.d/
            sudo sysctl --system

            # Reboot
            sudo reboot
            ```

            > **Secure Boot**: Packages are signed with the Surface Secure Boot key when the
            > `SURFACE_SB_KEY` secret is configured. Otherwise built without Secure Boot
            > signing — you must disable Secure Boot or enroll test keys manually.
          draft: false
          prerelease: false
          files: release-rpms/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
