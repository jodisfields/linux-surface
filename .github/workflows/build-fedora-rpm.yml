name: Build Fedora RPM

# CI pipeline: builds the linux-surface kernel as a Fedora RPM.
#
# On every push/PR:  builds RPM and uploads as a downloadable artifact.
# On tag push:       also publishes the RPM to a GitHub Release.
# Manual dispatch:   build + optional release.

on:
  push:
    branches:
      - develop
      - master
      - 'claude/**'
      - 'copilot/**'
    tags:
      - 'fedora-*'
      - 'release-*'

  pull_request:
    branches:
      - develop
      - master

  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish RPMs to a GitHub Release'
        required: false
        default: true
        type: boolean
      fedora_version:
        description: 'Fedora version to build for'
        required: false
        default: '41'
        type: choice
        options:
          - '40'
          - '41'
          - '42'

permissions:
  contents: read

concurrency:
  group: fedora-rpm-${{ github.ref }}
  cancel-in-progress: true

env:
  GPG_KEY_ID: 56C464BAAC421453
  FEDORA: ${{ github.event.inputs.fedora_version || '42' }}

jobs:
  build:
    name: Build RPM (Fedora ${{ github.event.inputs.fedora_version || '42' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache \
            /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/julia* /opt/pipx \
            /usr/share/az_* /opt/microsoft /usr/share/miniconda \
            /usr/local/aws-* /usr/local/share/vcpkg /usr/share/kotlinc \
            /usr/share/gradle* /usr/share/sbt /usr/lib/google-cloud-sdk \
            /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize containers
        run: |
          # Mount /mnt into container for extra build space (~60GB)
          if command -v docker &> /dev/null; then DOCKER=docker; else DOCKER=podman; fi
          $DOCKER run -d --name "${GITHUB_REPOSITORY_ID}" \
            -v "${GITHUB_WORKSPACE}:/working" \
            -v "/mnt:/mnt" \
            --workdir "/working" \
            --entrypoint tail \
            "registry.fedoraproject.org/fedora:${{ env.FEDORA }}" -f /dev/null

      - name: Install build dependencies
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-builddeps

      - name: Setup Secure Boot certificate
        env:
          SB_KEY: ${{ secrets.SURFACE_SB_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SB_KEY \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-secureboot

      - name: Build packages
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash -c 'set -euxo pipefail &&
              cd pkg/fedora/kernel-surface &&
              git config --global user.name surfacebot &&
              git config --global user.email surfacebot@users.noreply.github.com &&
              python3 build-linux-surface.py --mode srpm --ark-dir /mnt/kernel-ark --outdir srpm &&
              rm -rf /mnt/kernel-ark &&
              df -h / /mnt &&
              echo "=== SRPM files ===" &&
              ls -la srpm/ &&
              SRPM=$(find srpm -name "*.src.rpm" -type f | head -1) &&
              test -n "$SRPM" &&
              echo "Building from: $SRPM" &&
              rpmbuild -rb --define "_topdir /mnt/rpmbuild" --define "_rpmdir /mnt/rpms" "$SRPM" &&
              echo "=== Built RPMs ===" &&
              find /mnt/rpms /mnt/rpmbuild -name "*.rpm" -type f 2>/dev/null'

      - name: Dump container logs on failure
        if: failure()
        run: docker logs "${GITHUB_REPOSITORY_ID}" 2>&1 | tail -500 || true

      - name: Check disk space
        if: always()
        run: df -h / /mnt

      - name: Collect built RPMs
        run: |
          mkdir -p built-rpms
          # RPMs are on /mnt which is bind-mounted from host
          find /mnt/rpms /mnt/rpmbuild -name '*.rpm' -type f -exec cp {} built-rpms/ \; 2>/dev/null || true
          echo "=== Collected RPMs ==="
          ls -lh built-rpms/
          RPM_COUNT=$(find built-rpms -name '*.rpm' -type f | wc -l)
          if [[ "$RPM_COUNT" -eq 0 ]]; then
            echo "::error::No RPM packages were built"
            exit 1
          fi
          echo "Found $RPM_COUNT RPMs"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kernel-surface-fedora-${{ env.FEDORA }}-rpms
          path: built-rpms/
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: |
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      )
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            pkg/fedora/kernel-surface/build-linux-surface.py
            contrib

      - name: Download RPM artifacts
        uses: actions/download-artifact@v6
        with:
          name: kernel-surface-fedora-${{ env.FEDORA }}-rpms
          path: release-rpms

      - name: Determine release tag and kernel version
        id: meta
        run: |
          # Extract kernel version from the build script
          KERNEL_VER=$(grep 'PACKAGE_TAG' pkg/fedora/kernel-surface/build-linux-surface.py \
            | grep -oP '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' | head -1)

          if [[ -z "$KERNEL_VER" ]]; then
            echo "::error::Failed to extract kernel version from PACKAGE_TAG"
            exit 1
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="kernel-surface-${KERNEL_VER}-$(date +%Y%m%d)"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "kernel_version=$KERNEL_VER" >> $GITHUB_OUTPUT
          echo "Release: $TAG (kernel $KERNEL_VER)"

          # List the RPMs
          echo "=== Release assets ==="
          ls -lh release-rpms/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "kernel-surface ${{ steps.meta.outputs.kernel_version }} (Fedora ${{ env.FEDORA }})"
          body: |
            ## linux-surface kernel ${{ steps.meta.outputs.kernel_version }} — Fedora ${{ env.FEDORA }} RPMs

            Built from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            ### Included patches & features
            - All upstream **linux-surface** hardware patches (Surface SAM, IPTS/ITHC touchscreen, cameras, secureboot, GPE, type-cover, etc.)
            - Surface Laptop Studio 1 thermal management config included

            ### Installation

            ```bash
            # Install the kernel
            sudo dnf install ./kernel-surface-[0-9]*.rpm ./kernel-surface-core-*.rpm ./kernel-surface-modules-*.rpm

            # (Optional) Clone the repo for contrib config files
            git clone --depth 1 ${{ github.server_url }}/${{ github.repository }}.git /tmp/linux-surface

            # (Surface Laptop Studio 1) Apply thermal config
            sudo cp /tmp/linux-surface/contrib/thermald/surface_laptop_studio_1/thermal-conf.xml /etc/thermald/
            sudo cp /tmp/linux-surface/contrib/thermald/surface_laptop_studio_1/thermal-cpu-cdev-order.xml /etc/thermald/
            sudo systemctl restart thermald

            # (Optional) Apply runtime performance tuning
            sudo cp /tmp/linux-surface/contrib/performance-tuning/99-surface-performance.conf /etc/sysctl.d/
            sudo sysctl --system

            # Reboot
            sudo reboot
            ```

            > **Secure Boot**: Packages are signed with the Surface Secure Boot key when the
            > `SURFACE_SB_KEY` secret is configured. Otherwise built without Secure Boot
            > signing — you must disable Secure Boot or enroll test keys manually.
          draft: false
          prerelease: false
          files: release-rpms/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
