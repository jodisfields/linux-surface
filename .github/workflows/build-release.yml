name: Build Kernel & Publish Release

# Builds the linux-surface kernel for multiple distributions and publishes
# a GitHub Release with all artifacts.
#
# Triggers:
#   1. Push a tag matching 'release-*' or 'kernel-surface-*'
#   2. Run manually from the Actions tab (workflow_dispatch)
#
# Required secrets (optional - build works without them):
#   SURFACE_SB_KEY        - base64-encoded Secure Boot private key
#   LINUX_SURFACE_GPG_KEY - base64-encoded GPG private key for signing

on:
  push:
    tags:
      - 'release-*'
      - 'kernel-surface-*'

  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GPG_KEY_ID: 56C464BAAC421453

jobs:
  build-fedora:
    name: Build Fedora ${{ matrix.fedora }} Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [42, 43]
    steps:
      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-docker-images: true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize Fedora container
        run: |
          bash ./.github/scripts/container/create.sh \
            registry.fedoraproject.org/fedora:${{ matrix.fedora }}

      - name: Install build dependencies
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-builddeps

      - name: Setup secureboot certificate
        env:
          SB_KEY: ${{ secrets.SURFACE_SB_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SB_KEY \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-secureboot

      - name: Build RPM packages
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh build-packages

      - name: Sign RPM packages
        env:
          GPG_KEY: ${{ secrets.LINUX_SURFACE_GPG_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e GPG_KEY \
            -e GPG_KEY_ID \
            -- \
            bash ./.github/scripts/package/fedora.sh sign-packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ matrix.fedora }}-packages
          path: pkg/fedora/kernel-surface/out/x86_64

  build-arch:
    name: Build Arch Packages
    runs-on: ubuntu-latest
    steps:
      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-docker-images: true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize container
        run: |
          bash ./.github/scripts/container/create.sh archlinux

      - name: Install build dependencies
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/arch.sh setup-builddeps

      - name: Setup secureboot certificate
        env:
          SB_KEY: ${{ secrets.SURFACE_SB_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SB_KEY \
            -- \
            bash ./.github/scripts/package/arch.sh setup-secureboot

      - name: Build packages
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/arch.sh build-packages

      - name: Sign packages
        env:
          GPG_KEY: ${{ secrets.LINUX_SURFACE_GPG_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e GPG_KEY \
            -e GPG_KEY_ID \
            -- \
            bash ./.github/scripts/package/arch.sh sign-packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arch-packages
          path: pkg/arch/kernel/release

  build-debian:
    name: Build Debian Packages
    runs-on: ubuntu-latest
    steps:
      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-docker-images: true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize containers
        run: |
          bash ./.github/scripts/container/create.sh ubuntu:22.04

      - name: Install build dependencies
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/debian.sh setup-builddeps

      - name: Setup secureboot certificate
        env:
          SB_KEY: ${{ secrets.SURFACE_SB_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SB_KEY \
            -- \
            bash ./.github/scripts/package/debian.sh setup-secureboot

      - name: Build packages
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/debian.sh build-packages

      - name: Sign packages
        env:
          GPG_KEY: ${{ secrets.LINUX_SURFACE_GPG_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e GPG_KEY \
            -e GPG_KEY_ID \
            -- \
            bash ./.github/scripts/package/debian.sh sign-packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: pkg/debian/release

  release:
    name: Create GitHub Release
    if: |
      always() &&
      (needs.build-fedora.result == 'success' || needs.build-arch.result == 'success' || needs.build-debian.result == 'success') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'))
    needs: [build-fedora, build-arch, build-debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
        continue-on-error: true

      - name: Flatten artifacts into release directory
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.deb' \) \
            -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -lh release-assets/

      - name: Generate release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="build-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Linux Surface Kernel ${{ steps.tag.outputs.tag }}"
          body: |
            ## Linux Surface Kernel with CachyOS Performance Tweaks

            Built from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            ### Included Patches
            - All linux-surface hardware patches (SAM, IPTS/ITHC, cameras, type-cover, etc.)
            - **BORE** CPU scheduler for improved desktop responsiveness
            - **BBR v3** TCP congestion control

            ### Performance Config (CachyOS-inspired)
            - 1000 Hz timer, full preemption, full tickless (NO_HZ_FULL)
            - MGLRU, Transparent HugePages (always), ZSWAP with zstd
            - sched-ext support, RCU boost/lazy, DAMON reclaim
            - Hardware crypto acceleration, WireGuard built-in
            - NTSYNC for Wine/Proton, KSM, PSI
            - Runtime sysctl tuning (dirty ratios, BBR3 default, swappiness)

            ### Surface Laptop Studio 1 Enhancements
            - dGPU hotplug (NVIDIA RTX 3050 Ti), Thunderbolt 4/USB4
            - IPTS pen/touch, tablet mode sensors
            - Optimized thermald configuration included

            ### Installation

            **Fedora (recommended for SLS1):**
            ```bash
            sudo dnf install ./kernel-surface-*.rpm
            sudo cp contrib/thermald/surface_laptop_studio_1/thermal-conf.xml /etc/thermald/
            sudo cp contrib/thermald/surface_laptop_studio_1/thermal-cpu-cdev-order.xml /etc/thermald/
            sudo systemctl restart thermald
            ```

            **Arch Linux:**
            ```bash
            sudo pacman -U linux-surface-*.pkg.tar.zst linux-surface-headers-*.pkg.tar.zst
            ```

            **Debian/Ubuntu:**
            ```bash
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb
            ```
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
