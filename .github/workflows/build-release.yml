name: Build and Release

# Builds the linux-surface kernel (Fedora RPMs) and publishes a GitHub Release.
#
# Trigger options:
#   1. Push a tag matching 'kernel-surface-*'
#      e.g.  git tag kernel-surface-6.19.10-1 && git push origin kernel-surface-6.19.10-1
#   2. Run manually from the "Actions" tab (workflow_dispatch).
#
# Required repository secrets (all optional – build will still succeed but
# packages will not be signed / secureboot-enabled):
#   SURFACE_SB_KEY   – base64-encoded Secure Boot private key (MOK.key)
#   LINUX_SURFACE_GPG_KEY – base64-encoded GPG private key for RPM signing
#
# The workflow uses GITHUB_TOKEN (built-in) for creating the GitHub Release,
# so no extra bot token is required.

env:
  FEDORA: 43
  GPG_KEY_ID: 56C464BAAC421453

on:
  push:
    tags:
      - 'kernel-surface-*'

  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release after building'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build Kernel (Fedora ${{ env.FEDORA }})
    runs-on: ubuntu-latest

    steps:
      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-docker-images: true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize Fedora container
        run: |
          bash ./.github/scripts/container/create.sh \
            registry.fedoraproject.org/fedora:${{ env.FEDORA }}

      - name: Install build dependencies
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-builddeps

      - name: Setup Secure Boot certificate
        env:
          SB_KEY: ${{ secrets.SURFACE_SB_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SB_KEY \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-secureboot

      - name: Build RPM packages
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh build-packages

      - name: Sign RPM packages
        env:
          GPG_KEY: ${{ secrets.LINUX_SURFACE_GPG_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e GPG_KEY \
            -e GPG_KEY_ID \
            -- \
            bash ./.github/scripts/package/fedora.sh sign-packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ env.FEDORA }}-surface-latest
          path: pkg/fedora/kernel-surface/out/x86_64

  release:
    name: Publish GitHub Release
    # Run for tag pushes or when manually requested
    if: >
      (github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to create releases and upload assets

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: fedora-${{ env.FEDORA }}-surface-latest
          path: release-assets

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch: derive a tag from the kernel version in the build script
            KERNEL_VER=$(grep 'PACKAGE_TAG' pkg/fedora/kernel-surface/build-linux-surface.py \
              | grep -oP '[\d]+\.[\d]+\.[\d]+-[\d]+' | head -1 || echo "unknown")
            echo "tag=kernel-surface-${KERNEL_VER}" >> "$GITHUB_OUTPUT"
          fi
        # Need the repo checked out to read the build script on manual dispatch
        # Use the artifact step as a signal that checkout isn't needed; fall back gracefully.

      - name: Checkout code (for version lookup on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Determine release tag (manual dispatch)
        id: tag_manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          KERNEL_VER=$(grep 'PACKAGE_TAG' pkg/fedora/kernel-surface/build-linux-surface.py \
            | grep -oP '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' | head -1 || echo "unknown")
          echo "tag=kernel-surface-${KERNEL_VER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_manual.outputs.tag || steps.tag.outputs.tag }}
          name: >
            linux-surface ${{ steps.tag_manual.outputs.tag || steps.tag.outputs.tag }}
            (Fedora ${{ env.FEDORA }})
          body: |
            ## linux-surface kernel — Fedora ${{ env.FEDORA }}

            Fedora ${{ env.FEDORA }} RPMs for the **linux-surface** kernel, built from
            [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            ### Included patches & features
            - All upstream **linux-surface** hardware patches (Surface SAM, IPTS/ITHC
              touchscreen, cameras, secureboot, GPE, type-cover, etc.)
            - **BORE** CPU scheduler (v6.6.2) for improved desktop responsiveness
            - **BBR v3** TCP congestion control for better network throughput
            - 1000 Hz timer, full-preempt, full tickless, Transparent HugePages
            - NTSYNC (NT sync primitives) for Wine/Proton compatibility

            ### Installation (Fedora)
            ```bash
            sudo rpm -ivh kernel-surface-*.rpm
            ```

            > **Secure Boot**: packages signed with the Surface Secure Boot key when the
            > `SURFACE_SB_KEY` secret is configured; otherwise built with Red Hat test keys
            > (Secure Boot must be disabled or the test key enrolled manually).
          files: release-assets/*
          fail_on_unmatched_files: false
          generate_release_notes: false
