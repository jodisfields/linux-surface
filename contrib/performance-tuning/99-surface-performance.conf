# CachyOS-inspired performance tuning for Surface devices
# Install to /etc/sysctl.d/99-surface-performance.conf
#
# These settings improve desktop responsiveness and I/O latency.

# Reduce dirty page writeback thresholds for better I/O latency
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Reduce scheduler migration cost for faster task wakeup on preferred CPU
kernel.sched_migration_cost_ns = 250000

# Increase VFS cache pressure slightly for better memory reclaim
vm.vfs_cache_pressure = 150

# Enable MGLRU if available (kernel 6.1+)
vm.lru_gen_enabled = 7

# Reduce swappiness - prefer keeping apps in RAM on desktops
vm.swappiness = 10

# Increase max map count (helps with gaming/Wine/Proton)
vm.max_map_count = 2147483642

# Network: increase default/max buffer sizes for BBR3
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Network: optimize buffer sizes
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216

# Network: enable TCP fast open
net.ipv4.tcp_fastopen = 3

# Disable kernel NMI watchdog (reduces power usage on laptops)
kernel.nmi_watchdog = 0

# Compact memory proactively
vm.compaction_proactiveness = 20

# Enable transparent hugepage defrag (for khugepaged)
vm.hugepages_treat_as_movable = 1

# Increase inotify watchers (helps IDEs and file-heavy workloads)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
